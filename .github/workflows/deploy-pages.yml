name: Deploy team website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check website scripts
        run: npm run check
      - name: Refresh data when source notes are present
        shell: bash
        run: |
          if [ -f '04_Projects/Action Register.md' ] && [ -f '04_Projects/Work Overview.md' ]; then
            npm run import
          else
            echo '::notice::Obsidian source notes are absent. Publishing the committed public/data.json snapshot.'
          fi
      - name: Validate deployable snapshot
        run: node scripts/check-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
