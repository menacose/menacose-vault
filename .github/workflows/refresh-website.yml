name: Refresh website from Obsidian

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Obsidian notes from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: menacose-vault
          sparse-checkout: |
            03_Meetings
            04_Projects
          persist-credentials: false
      - name: Read website branch
        uses: actions/checkout@v4
        with:
          ref: Github-Pages-Branches
          path: website
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild website data from vault
        working-directory: website
        run: |
          npm run import -- ../menacose-vault
          npm run check
          node scripts/check-site.mjs
      - name: Save refreshed data on website branch
        working-directory: website
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data.json
          if ! git diff --cached --quiet; then
            source_sha=$(git -C ../menacose-vault rev-parse --short HEAD)
            git commit -m "Refresh website from main ${source_sha}"
            git push origin HEAD:Github-Pages-Branches
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/public
      - name: Publish contributor website
        id: deployment
        uses: actions/deploy-pages@v4
